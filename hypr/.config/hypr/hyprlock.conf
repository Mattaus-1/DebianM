general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 0
    blur_size = 8
    brightness = 0.65
    vibrancy = 0.18
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 72
    font_family = DejaVu Sans
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgb(a9b1d6)
    font_size = 18
    font_family = DejaVu Sans
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    outer_color = rgb(7aa2f7)
    inner_color = rgba(1a1b26dd)
    font_color = rgb(c0caf5)
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    capslock_color = rgb(e0af68)
    rounding = 14
    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Digite sua senha</span>
    fail_text = <span foreground="##f7768e">Senha incorreta</span>
    position = 0, -35
    halign = center
    valign = center
}
